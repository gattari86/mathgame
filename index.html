<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCrafters: Block Adventures</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-sky-200">

    <div id="game-container" class="bg-amber-100 p-6 md:p-10 rounded-lg shadow-xl border-4 border-yellow-900 max-w-3xl w-full text-center">

        <!-- Screen 0: Start Screen -->
        <div id="start-screen">
            <h1 class="text-2xl md:text-4xl mb-4 text-yellow-900">MathCrafters</h1>
            <p class="text-lg md:text-xl mb-8">Block Adventures</p>
            <button id="start-button" class="game-button text-xl md:text-2xl" style="background-color: #2ECC71; border-color: #27AE60; box-shadow: 4px 4px 0px #27AE60;">
                Click to Start
            </button>
        </div>

        <!-- Screen 1: Character Selection (initially hidden) -->
        <div id="character-select-screen" class="hidden">
            <h1 class="text-xl md:text-3xl mb-6 text-yellow-900">Choose Your MathCrafter!</h1>
            <div id="character-options" class="flex justify-center items-center flex-wrap mb-6"></div>
            <div class="mb-4">
                <p class="text-sm md:text-base">Your Pick:</p>
                <div id="character-preview" class="w-16 h-16 md:w-20 md:h-20 mx-auto mt-2 rounded-md block" style="background-color: #ccc;"></div>
            </div>
            <button id="confirm-character-button" class="game-button block mx-auto" disabled>Let's Go!</button>
        </div>

        <!-- Screen 2: Level Selection (initially hidden) -->
        <div id="level-select-screen" class="hidden">
            <h1 class="text-xl md:text-3xl mb-6 text-yellow-900">Select Difficulty</h1>
            <div class="space-y-4">
                <button id="level-easy" data-difficulty="easy" class="game-button block w-full md:w-3/4 mx-auto" style="background-color: #66BB6A;">Easy Peasy</button>
                <button id="level-medium" data-difficulty="medium" class="game-button block w-full md:w-3/4 mx-auto" style="background-color: #FFA726;">Medium Fun</button>
                <button id="level-hard" data-difficulty="hard" class="game-button block w-full md:w-3/4 mx-auto" style="background-color: #EF5350;">Super Challenge</button>
            </div>
            <button id="go-to-world-button" class="game-button block w-full md:w-3/4 mx-auto mt-6" style="background-color: #5DADE2;">Go to My World</button>
            <button id="back-to-character-select" class="game-button block mx-auto mt-6 text-xs" style="background-color: #78909C;">Change Character</button>
        </div>

        <!-- Screen 3: Game Screen (initially hidden) -->
        <div id="game-screen" class="hidden">
            <div class="flex justify-between items-center mb-4 text-sm md:text-base">
                 <div id="player-char-display" class="w-10 h-10 rounded-sm block"></div>
                 <div id="game-stats" class="flex flex-col items-end">
                    <div id="level-display">LVL: 1</div>
                    <div id="xp-display">XP: 0/10</div>
                    <div id="blocks-display">Blocks: 0</div>
                 </div>
            </div>
            <h2 id="level-title" class="text-lg md:text-2xl text-yellow-900 mb-2">Level: Easy</h2>
            <div id="problem-area" class="bg-white p-4 md:p-6 rounded-lg shadow-inner min-h-[200px] md:min-h-[250px] mb-4 border-2 border-gray-300 flex flex-col justify-center items-center">
                <p id="instruction-text" class="text-sm md:text-lg mb-4">Let's get started!</p>
                <div id="visual-problem" class="flex flex-wrap justify-center items-center gap-2 mb-4"></div>
                <div id="answer-options" class="flex justify-center items-center gap-3 mt-4"></div>
            </div>
            <div id="feedback-message" class="mt-4 font-bold text-center">&nbsp;</div>
            <button id="quit-level-button" class="game-button block mx-auto mt-6 text-xs" style="background-color: #78909C;">Change Level</button>
        </div>

        <!-- Screen 4: World Screen (initially hidden) -->
        <div id="world-screen" class="hidden">
            <h1 class="text-xl md:text-3xl mb-4 text-yellow-900">My World</h1>
            <div class="flex justify-between items-center mb-4 text-sm md:text-base">
                <div id="world-player-char" class="w-10 h-10 rounded-sm block"></div>
                <div id="world-stats" class="flex flex-col items-end">
                    <div id="world-level-display">LVL: 1</div>
                    <div id="world-xp-display">XP: 0/10</div>
                    <div id="world-blocks-display">Blocks: 0</div>
                </div>
            </div>
            <div id="building-grid" class="grid grid-cols-10 gap-1 bg-green-200 p-2 rounded-lg border-2 border-green-800" style="height: 300px;"></div>
            <div id="color-palette-container" class="mt-4">
                <p class="text-sm">Unlocked Colors:</p>
                <div id="color-palette" class="flex justify-center items-center gap-2 mt-2"></div>
            </div>
            <button id="back-to-level-select" class="game-button block mx-auto mt-6" style="background-color: #78909C;">Back to Game</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
